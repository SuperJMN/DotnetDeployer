# Azure Pipelines configuration for DotnetDeployer
# Validate packaging here; DotnetDeployer.Fleet is the sole NuGet publisher.

trigger:
  - master
  - main

variables:
  - name: Agent.Source.Git.ShallowFetchDepth
    value: 0

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    fetchDepth: 0  # Full clone for GitVersion

  # Exercise packaging without racing Fleet for an immutable NuGet version.
  - pwsh: dotnet run --project src/DotnetDeployer.Tool/DotnetDeployer.Tool.csproj -- --dry-run
    displayName: Validate NuGet packages (dry run)
